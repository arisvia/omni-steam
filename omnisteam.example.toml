# ==============================================================================
# OmniSteam 统一配置文件示例
# 
# 存放位置 (自动按平台查找):
#   - Windows: <Steam 安装目录>/omnisteam.toml
#   - Linux / Steam Deck: ~/.config/omnisteam/omnisteam.toml
#   - macOS: ~/Library/Application Support/OmniSteam/omnisteam.toml
# ==============================================================================

[log]
# 日志输出级别: "trace", "debug", "info", "warn", "error"
level = "info"
# 是否输出到独立日志文件 (默认 true)
file_output = true

[manifest]
# 获取 Depot Manifest 授权请求码的上游服务
# 预设可选: "opensteamtool", "steamrun", "wudrm"，或填写自建的完整 URL
url = "opensteamtool"

# Manifest 下载及网络请求超时时间 (毫秒)
timeout_resolve_ms = 5000
timeout_connect_ms = 5000
timeout_send_ms    = 10000
timeout_recv_ms    = 10000

[stats]
# 是否开启成就与统计数据在线同步 API (https://stats.opensteamtool.com/{appid})
# 优先级: Lua setStat > stats API > 默认预设 SteamID
enable_api = true

[lua]
# ------------------------------------------------------------------------------
# Lua 脚本监听目录配置
# 
# 默认加载目录 (无需配置自动包含):
#   - Windows: <Steam 根目录>/config/lua/
#   - Linux / Steam Deck: ~/.config/omnisteam/lua/
#   - macOS: ~/Library/Application Support/OmniSteam/lua/
# 
# paths: 可以在此处添加任意数量的自定义目录，内核热重载引擎会同时监控所有目录。
# ------------------------------------------------------------------------------
paths = [
    # "D:/MyGameConfigs/lua",
    # "/home/deck/my_steam_lua"
]

[inject]
# 是否开启向游戏子进程注入辅助动态库 (用于绕过部分游戏内鉴权)
enabled = false
# library_x64 = "OmniSteam.GameHook.x64.dll"
# library_x86 = "OmniSteam.GameHook.x86.dll"

[cloud]
# Steam 云存档重定向 (实验性功能)
enabled = false
# save_path = ""
