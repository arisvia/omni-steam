name: Signature Harvest

# Harvests OmniSteam function signatures (RVA/symbol data) from official
# Steam client binaries on each platform. Valve binaries themselves are NOT
# committed - they are uploaded as short-lived private artifacts only.
# Generated signature TOMLs are pushed back to the repository automatically.

on:
  schedule:
    # Every Monday 03:00 UTC - keeps signature DB current with Steam client updates
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      push_signatures:
        description: 'Push harvested signature TOMLs back to the repository'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  harvest-linux:
    name: Harvest Linux steamclient.so
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y binutils file curl dpkg-dev

      - name: Fetch Steam bootstrap and extract client libraries
        run: |
          mkdir -p steam-dist && cd steam-dist
          POOL="https://repo.steampowered.com/steam/pool/steam/s/steam-launcher"
          DEB_URL=$(curl -fsSL -A "Mozilla/5.0" "$POOL/" | grep -oE 'steam-launcher_[0-9.]+_all\.deb' | sort -uV | tail -1)
          echo "Resolved deb: ${DEB_URL:-<none>}"
          if [ -n "$DEB_URL" ]; then
            curl -fsSLO "$POOL/$DEB_URL"
            dpkg-deb -x "$DEB_URL" root
            BOOTSTRAP=$(find root -name 'bootstraplinux*' | head -1)
            [ -n "$BOOTSTRAP" ] && tar -xf "$BOOTSTRAP" -C .
          fi
          # Fallback/secondary source: steamcmd self-update installs linux32 client files.
          # Collect every copy but deduplicate by content hash - the bootstrap tar and
          # steamcmd's home often carry the identical .so, and `cp --parents` used to
          # zip the same binary twice (once under ./, once under $HOME), doubling the
          # artifact size.
          if ! find . -name 'steamclient*.so' | grep -q .; then
            echo "Bootstrap lacked steamclient.so; bootstrapping steamcmd..."
            mkdir -p cmd && cd cmd
            curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar -xz
            ./steamcmd.sh +quit || true
            cd ..
          fi
          n=0
          declare -A SEEN
          while IFS= read -r f; do
            h=$(sha256sum "$f" | cut -d' ' -f1)
            if [ -z "${SEEN[$h]:-}" ]; then
              SEEN[$h]=1
              n=$((n+1))
              mkdir -p "steam-dist/uniq$n"
              cp "$f" "steam-dist/uniq$n/$(basename "$f")"
            fi
          done < <(find . "$HOME" -name 'steamclient*.so' -type f 2>/dev/null)
          COUNT=$n
          echo "Unique steamclient.so copies: $COUNT"
          find steam-dist -name 'steamclient*.so' -printf '%p\n'
          [ "$COUNT" -gt 0 ] || { echo "::error::no steamclient.so obtained"; exit 1; }

      - name: Harvest signatures
        run: python3 tools/harvest_signatures.py --scan-root steam-dist --out signatures-out/linux

      - name: Upload binaries artifact (private, 7 days)
        uses: actions/upload-artifact@v7
        with:
          name: steam-binaries-linux
          path: |
            steam-dist/**/steamclient*.so*
          retention-days: 7
          if-no-files-found: warn

      - name: Upload harvest output
        uses: actions/upload-artifact@v7
        with:
          name: signatures-linux
          path: signatures-out/
          retention-days: 90

  harvest-windows:
    name: Harvest Windows steamclient64.dll
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Steam silently
        shell: powershell
        run: |
          $setup = "$env:TEMP\SteamSetup.exe"
          curl.exe -L -o $setup https://steamcdn-a.akamaihd.net/client/installer/SteamSetup.exe
          Start-Process -FilePath $setup -ArgumentList '/S' -Wait

          # Resolve the actual install directory (installer may target another drive)
          $reg = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Valve\Steam' -ErrorAction SilentlyContinue
          $dir = if ($reg -and $reg.InstallPath) { $reg.InstallPath } else { 'C:\Program Files (x86)\Steam' }
          Write-Host "Steam directory: $dir"
          "STEAM_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append

          # First launch triggers the bootstrap download that produces steamclient64.dll
          $deadline = (Get-Date).AddSeconds(300)
          while (-not (Test-Path (Join-Path $dir 'steamclient64.dll')) -and (Get-Date) -lt $deadline) {
            if (Test-Path (Join-Path $dir 'steam.exe') -PathType Leaf) {
              Start-Process (Join-Path $dir 'steam.exe') -ArgumentList '-silent' -ErrorAction SilentlyContinue
            }
            Start-Sleep -Seconds 15
          }
          if (-not (Test-Path (Join-Path $dir 'steamclient64.dll'))) {
            throw "steamclient64.dll still missing after 300s in $dir"
          }

      - name: Locate client libraries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path steam-dist | Out-Null
          Copy-Item (Join-Path $env:STEAM_DIR 'steamclient64.dll') steam-dist/
          if (Test-Path (Join-Path $env:STEAM_DIR 'steamui.dll')) { Copy-Item (Join-Path $env:STEAM_DIR 'steamui.dll') steam-dist/ }
          Get-ChildItem steam-dist

      - name: Harvest signatures
        shell: pwsh
        run: |
          pip install pefile
          python tools/harvest_signatures.py --scan-root steam-dist --out signatures-out/windows

      - name: Sync upstream pattern database
        shell: pwsh
        run: |
          pip install pefile capstone
          python tools/sync_upstream_patterns.py --binary steam-dist/steamclient64.dll --out signatures-out/windows --sub steamclient --sub steamui
        # A brand-new Steam build may not be anchored upstream yet; that is
        # informational, not a failure.
        continue-on-error: true

      - name: Upload binaries artifact (private, 7 days)
        uses: actions/upload-artifact@v7
        with:
          name: steam-binaries-windows
          path: steam-dist/*.dll
          retention-days: 7

      - name: Upload harvest output
        uses: actions/upload-artifact@v7
        with:
          name: signatures-windows
          path: signatures-out/
          retention-days: 90

  harvest-macos:
    name: Harvest macOS steamclient.dylib
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download, run once and collect Steam client
        run: |
          curl -L -o steam.dmg https://steamcdn-a.akamaihd.net/client/installer/steam.dmg
          hdiutil attach steam.dmg -nobrowse -quiet
          VOL=$(ls -d /Volumes/Steam* | head -1)
          mkdir -p steam-dist
          cp -R "$VOL/Steam.app" steam-dist/
          hdiutil detach "$VOL" -quiet || true

          # The dmg ships only the shell app; the client files (incl.
          # steamclient.dylib) are downloaded by the first launch.
          ./steam-dist/Steam.app/Contents/MacOS/steam_osx & APP_PID=$!
          for i in $(seq 1 24); do
            sleep 10
            if find "$HOME/Library/Application Support/Steam" -name 'steamclient*.dylib' 2>/dev/null | grep -q .; then
              break
            fi
          done
          kill $APP_PID 2>/dev/null || true

          # Consolidate every discovered library into the single scan root
          find "$HOME/Library/Application Support/Steam" \( -iname 'steamclient*.dylib' -o -iname 'steamui*.dylib' \) \
            -exec cp {} steam-dist/ \; 2>/dev/null || true
          COUNT=$(find steam-dist -iname '*steamclient*' | wc -l)
          echo "steamclient copies: $COUNT"
          find steam-dist \( -iname '*steamclient*' -o -iname 'steamui*' \) -print
          [ "$COUNT" -gt 0 ] || { echo "::error::no steamclient.dylib obtained"; exit 1; }

      - name: Harvest signatures
        run: python3 tools/harvest_signatures.py --scan-root steam-dist --out signatures-out/macos

      - name: Upload binaries artifact (private, 7 days)
        uses: actions/upload-artifact@v7
        with:
          name: steam-binaries-macos
          path: |
            steam-dist/**/*steamclient*
          retention-days: 7
          if-no-files-found: warn

      - name: Upload harvest output
        uses: actions/upload-artifact@v7
        with:
          name: signatures-macos
          path: signatures-out/
          retention-days: 90

  collect-and-push:
    name: Collect & Push Signatures
    needs: [harvest-linux, harvest-windows, harvest-macos]
    runs-on: ubuntu-latest
    # Push whatever platforms succeeded; a single failed platform must not
    # discard the others' harvest. Manual runs honour the toggle.
    if: ${{ !cancelled() && (inputs.push_signatures != false) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all harvest outputs
        uses: actions/download-artifact@v7
        with:
          pattern: signatures-*
          merge-multiple: true
          path: signatures-collected

      - name: Stage into repository tree
        run: |
          if ! find signatures-collected -name '*.toml' | grep -q .; then
            echo "No signature TOMLs collected from any platform"
            exit 0
          fi
          STAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          # harvest_signatures.py already emits canonical platform dirs
          # (windows-x64 / linux-x64 / linux-i386 / macos-universal) matching
          # PatternLoader::GetSignaturePlatformDir.
          {
            echo "# OmniSteam Signature Database"
            echo "# Regenerated from official Steam clients on ${STAMP}"
            echo "# Consumed by PatternLoader via cache/signatures/ (deployed by CoreInstaller)"
            echo ""
            for f in $(find signatures-collected -name '*.toml' | sort); do
            platform=$(dirname "$f" | xargs basename)
            if grep -q 'rva' "$f"; then
              mkdir -p "signatures/${platform}"
              cp "$f" "signatures/${platform}/"
              echo "- signatures/${platform}/$(basename "$f")"
            else
              echo "- skipped empty: $f"
            fi
          done
          } > signatures/README.md
          cat signatures/README.md

      - name: Commit and push
        run: |
          git config user.name "omnisteam-signature-bot"
          git config user.email "actions@users.noreply.github.com"
          git add signatures/
          if git diff --cached --quiet; then
            echo "No signature changes to push"
            exit 0
          fi
          git commit -m "chore(signatures): refresh harvested Steam client signatures [skip ci]"
          git push
