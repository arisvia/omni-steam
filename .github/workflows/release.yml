name: Release OmniSteam

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - 'assets/**'
      - 'depotkeys.bin'
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Release on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform_id: linux-x64
            arch: x86_64
            cmake_args: "-DCMAKE_BUILD_TYPE=Release"
          - os: ubuntu-latest
            platform_id: linux-i386
            arch: i386
            cmake_args: "-DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_LIBRARY_PATH=/usr/lib/i386-linux-gnu -DCMAKE_INCLUDE_PATH=/usr/include/i386-linux-gnu -DCMAKE_SYSTEM_PROCESSOR=i686"
          - os: windows-latest
            platform_id: windows-x64
            arch: x64
            cmake_args: "-DCMAKE_BUILD_TYPE=Release -A x64"
          - os: macos-latest
            platform_id: macos-arm64
            arch: arm64
            cmake_args: "-DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DOPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl@3"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" = "i386" ]; then
            sudo dpkg --add-architecture i386
            sudo apt-get update
            sudo apt-get install -y gcc-multilib g++-multilib libssl-dev:i386 libcurl4-openssl-dev:i386
          else
            sudo apt-get install -y libssl-dev libcurl4-openssl-dev
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 curl

      - name: Configure CMake
        run: cmake -B build ${{ matrix.cmake_args }}

      - name: Build OmniSteam Core & CLI
        run: cmake --build build --config Release --parallel

      - name: Package Core & CLI Distributables
        run: |
          mkdir -p dist/core dist/cli packages

          # Windows packaging
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build/bin/Release/*dwmapi* dist/core/ 2>/dev/null || true
            cp build/bin/Release/*omnisteam.dll dist/core/ 2>/dev/null || true
            cp build/lib/*omnisteam.dll dist/core/ 2>/dev/null || true
            7z a "packages/omnisteam-core-${{ matrix.platform_id }}.zip" ./dist/core/*

            cp build/bin/Release/omnisteam.exe dist/cli/ 2>/dev/null || true
            cp build/bin/omnisteam.exe dist/cli/ 2>/dev/null || true
            7z a "packages/omnisteam-cli-${{ matrix.platform_id }}.zip" ./dist/cli/*
          else
            # Linux & macOS packaging
            cp build/lib/*omnisteam* dist/core/ 2>/dev/null || true
            tar -czf "packages/omnisteam-core-${{ matrix.platform_id }}.tar.gz" -C dist/core .

            cp build/bin/omnisteam dist/cli/ 2>/dev/null || true
            tar -czf "packages/omnisteam-cli-${{ matrix.platform_id }}.tar.gz" -C dist/cli .
          fi

      - name: Upload Binary Packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.platform_id }}
          path: packages/*

  build-decky-plugin:
    name: Package Decky Loader Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package Decky Plugin
        run: |
          mkdir -p packages
          if [ -d "plugins/decky-omnisteam" ]; then
            (cd plugins/decky-omnisteam && zip -r "../../packages/decky-omnisteam.zip" . -x "*.git*" -x "node_modules/*")
          fi
      - name: Upload Decky Package
        uses: actions/upload-artifact@v7
        with:
          name: packages-decky
          path: packages/*

  publish-release:
    name: Publish Release Assets
    needs: [build-binaries, build-decky-plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download all packages
        uses: actions/download-artifact@v7
        with:
          path: all-packages
          merge-multiple: true

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "release_name=Release ${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag_name=latest" >> $GITHUB_OUTPUT
            echo "release_name=OmniSteam Rolling Release" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          name: ${{ steps.release_tag.outputs.release_name }}
          prerelease: ${{ steps.release_tag.outputs.prerelease == 'true' }}
          files: all-packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
