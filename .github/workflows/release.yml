name: Release OmniSteam

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    name: Build Release Binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: omnisteam-linux-x64.tar.gz
            cmake_args: "-DCMAKE_BUILD_TYPE=Release"
          - os: windows-latest
            artifact_name: omnisteam-windows-x64.zip
            cmake_args: "-DCMAKE_BUILD_TYPE=Release -A x64"
          - os: macos-latest
            artifact_name: omnisteam-macos-arm64.tar.gz
            cmake_args: "-DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DOPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl@3"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libcurl4-openssl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 curl

      - name: Configure CMake
        run: cmake -B build ${{ matrix.cmake_args }}

      - name: Build OmniSteam Core & Manager
        run: cmake --build build --config Release --parallel

      - name: Create Package via CPack
        run: |
          cd build && cpack -C Release

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/OmniSteam-*.*
            build/lib/*
            build/bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
