name: OmniSteam CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            cmake_args: "-DCMAKE_BUILD_TYPE=Release"
          - os: ubuntu-latest
            arch: i386
            cmake_args: "-DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_LIBRARY_PATH=/usr/lib/i386-linux-gnu -DCMAKE_INCLUDE_PATH=/usr/include/i386-linux-gnu -DCMAKE_SYSTEM_PROCESSOR=i686"
          - os: windows-latest
            arch: x86_64
            cmake_args: "-DCMAKE_BUILD_TYPE=Release -A x64"
          - os: macos-latest
            arch: arm64
            cmake_args: "-DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DOPENSSL_ROOT_DIR=/opt/homebrew/opt/openssl@3"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" = "i386" ]; then
            sudo dpkg --add-architecture i386
            sudo apt-get update
            sudo apt-get install -y gcc-multilib g++-multilib libssl-dev:i386 libcurl4-openssl-dev:i386
          else
            sudo apt-get install -y libssl-dev libcurl4-openssl-dev
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 curl

      - name: Configure CMake
        run: cmake -B build ${{ matrix.cmake_args }} -DBUILD_TESTS=ON

      - name: Build OmniSteam
        run: cmake --build build --config Release --parallel
      - name: Run Unit Tests
        run: |
          ctest --test-dir build --output-on-failure -C Release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnisteam-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            build/lib/*
            build/bin/*
          if-no-files-found: ignore
