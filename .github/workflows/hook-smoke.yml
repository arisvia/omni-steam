name: Hook Smoke (real-machine unlock chain)

# ROADMAP P0.1/P0.2 substitute for local real machines:
# - Linux: genuine x86_64 kernel on the ubuntu runner; Steam runs under Xvfb
#   with LD_PRELOAD injection, then tools/smoke_status.py gates core_status.json.
# - macOS: macos-14 runners are REAL Apple Silicon hardware. Verifies both the
#   native arm64 slice and the Rosetta 2 x86_64 path (funchook mprotect EINVAL
#   question, ROADMAP §2.8).
# - Windows: proxy-DLL injection into the real client; additionally runs the
#   static GetOrAddAppData alias shape probe (tools/verify_appdata_alias.py)
#   against steamclient64.dll before the dynamic gate.
# Draft status: first runs may expose runner-specific Steam bootstrap issues;
# artifacts (core_status.json + client logs) are uploaded for triage.

on:
  workflow_dispatch:
  schedule:
    # Mondays 05:00 UTC, after the 03:00 signature harvest refreshes `data`.
    - cron: "0 5 * * 1"
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'tools/smoke_status.py'
      - 'tools/verify_appdata_alias.py'
      - '.github/workflows/hook-smoke.yml'

concurrency:
  group: hook-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-smoke:
    name: Linux x86_64 unlock-chain smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      OMNISTEAM_CACHE_DIR: ${{ github.workspace }}/smoke-cache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build + Steam runtime dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          # Build deps are HARD requirements: a silent apt failure here once
          # left CURL missing and broke CMake configure downstream.
          sudo apt-get install -y libssl-dev libcurl4-openssl-dev ccache xvfb xauth
          # Steam runtime libs are best-effort (package names drift across
          # Ubuntu releases; libgconf-2-4 no longer exists on noble).
          sudo apt-get install -y lib32gcc-s1 lib32stdc++6 libc6:i386 libgl1:i386 \
            libx11-6:i386 libxext6:i386 libxrandr2:i386 libxinerama1:i386 libxi6:i386 \
            libxcursor1:i386 libxss1:i386 libdbus-1-3:i386 \
            libfreetype6:i386 libfontconfig1:i386 libnm0:i386 || true

      - name: Enable unprivileged user namespaces (SteamRT requirement)
        run: |
          # Ubuntu 24.04 AppArmor restricts unprivileged userns by default;
          # SteamRT/pressure-vessel needs them (zenity error, run 44086929463).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Fetch current signatures from data branch
        run: |
          git fetch origin data
          mkdir -p "$OMNISTEAM_CACHE_DIR"
          git archive origin/data signatures | tar -x -C "$OMNISTEAM_CACHE_DIR"

      - name: Build core (bullseye toolchain for SteamRT glibc compat)
        run: |
          # SteamRT steamrt3c is Debian 11 (glibc 2.31); a core built on the
          # 24.04 host references GLIBC_2.34+ symbols and ld.so silently skips
          # the preload inside the container. Build in bullseye; pip cmake
          # because bullseye's own cmake (3.18) is below our minimum (3.20).
          docker run --rm -v "$PWD:/src" -w /src debian:bullseye bash -c '
            set -e
            # Bullseye is archived (deb.debian.org 404s since LTS end).
            printf "deb http://archive.debian.org/debian bullseye main\ndeb http://archive.debian.org/debian-security bullseye-security main\n" > /etc/apt/sources.list
            apt-get -o Acquire::Check-Valid-Until=false update
            apt-get -o Acquire::Check-Valid-Until=false install -y --no-install-recommends g++ ninja-build python3-pip ca-certificates git libssl-dev libcurl4-openssl-dev
            pip3 install cmake
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
            cmake --build build --target omnisteam_core --parallel
          '

      - name: Install Steam launcher
        run: |
          # Canonical stable launcher deb; the pool-listing scrape 404'd when
          # the newest entry vanished between listing and fetch.
          curl -fsSL -o steam-launcher.deb https://repo.steampowered.com/steam/archive/precise/steam_latest.deb
          sudo dpkg -i steam-launcher.deb || sudo apt-get -f install -y

      - name: Launch Steam under Xvfb with LD_PRELOAD injection
        run: |
          export GTK_A11Y=none
          LIB=$(find "$PWD/build" -name 'libomnisteam.so' | head -1)
          [ -n "$LIB" ] || { echo "::error::libomnisteam.so not built"; exit 1; }
          # SteamRT (pressure-vessel) drops LD_PRELOAD entries whose paths are
          # invisible inside the container; the workspace is not shared but
          # ~/.local/share/Steam is. Deploy to the production location so the
          # preload survives the container exec (run 44072592116: core init in
          # the steamrt64/steam wrapper, silence after the container hop).
          mkdir -p "$HOME/.local/share/Steam/ubuntu12_64"
          cp "$LIB" "$HOME/.local/share/Steam/ubuntu12_64/libomnisteam.so"
          LIB="$HOME/.local/share/Steam/ubuntu12_64/libomnisteam.so"
          echo "Injecting $LIB"
          have_host() {
            [ -f "$HOME/.local/share/Steam/steamrt64/steam" ] || [ -f "$HOME/.local/share/Steam/ubuntu12_64/steam" ]
          }
          # The /usr/bin/steam launcher blocks forever in steamdeps on headless
          # runners (interactive dependency prompt). Extract the bootstrap the
          # launcher would have copied and run steam.sh directly WITH preload:
          # the 32-bit bootstrap cannot load a 64-bit .so (wrong ELF class,
          # ld.so skips it silently), while the 64-bit host inherits LD_PRELOAD
          # through steam.sh's env setup. Do NOT set STEAM_RUNTIME=0 on the
          # steamrt64 path: it makes the container re-exec skip the runtime
          # library paths and the client dies on "libcrypto.so.3: cannot open
          # shared object file" (run 44214438393).
          mkdir -p "$HOME/.local/share/Steam"
          dpkg -L steam-launcher | grep -E '\.(sh|tar|gz|xz)$' | head -10
          BOOT=$(dpkg -L steam-launcher | grep -E 'bootstrap.*\.tar' | head -1)
          if [ -n "$BOOT" ] && [ -f "$BOOT" ]; then
            tar -xf "$BOOT" -C "$HOME/.local/share/Steam"
          # The steamrt3c runtime ships OpenSSL 1.1 but the steamrt64 client
          # links libcrypto.so.3; the outer exec only works by accident (host
          # Ubuntu 24.04 libs). Seed the runtime lib dirs with the host's
          # OpenSSL 3 as platform dirs appear (run 44221690593 forensics).
          (
            for i in $(seq 1 600); do
              for D in "$HOME/.local/share/Steam/steamrt64/pv-runtime/steam-runtime-steamrt"/steamrt*_platform_*/files/lib/x86_64-linux-gnu \
                       "$HOME/.local/share/Steam/steamrt64/pv-runtime/steam-runtime-steamrt"/var/tmp-*/usr/lib/x86_64-linux-gnu; do
                if [ -d "$D" ]; then
                  cp -n /usr/lib/x86_64-linux-gnu/libcrypto.so.3 /usr/lib/x86_64-linux-gnu/libssl.so.3 "$D/" 2>/dev/null || true
                fi
              done
              sleep 1
            done
          ) >/dev/null 2>&1 &
            yes | xvfb-run -a env PRESSURE_VESSEL_VERBOSE=1 LD_PRELOAD="$LIB" "$HOME/.local/share/Steam/steam.sh" +login anonymous 2>&1 | tee steam-run.log &
          else
            yes | xvfb-run -a env PRESSURE_VESSEL_VERBOSE=1 LD_PRELOAD="$LIB" steam +login anonymous 2>&1 | tee steam-run.log &
          fi
          STEAM_PID=$!
          # Download (~90s) + install (~30s) + host start + hook attach.
          for i in $(seq 1 84); do
            sleep 5
            if [ -f "$OMNISTEAM_CACHE_DIR/core_status.json" ]; then break; fi
            if [ $((i % 12)) -eq 0 ]; then
              echo "--- progress $((i*5))s ---"
              ps aux | grep -E "[s]team|[p]ressure-vessel|[s]rt-" | head -8 || true
            fi
          done
          if [ ! -f "$OMNISTEAM_CACHE_DIR/core_status.json" ] && have_host; then
            # Fallback: pressure-vessel may strip the preload at the container
            # hop. Relaunch the host directly with the runtime library path
            # steam.sh would have set (libcrypto.so.3 lives in pv-runtime).
            echo "--- no core_status; trying direct host launch with runtime libs ---"
            kill $STEAM_PID 2>/dev/null || true
            pkill -f steam.sh 2>/dev/null || true
            pkill -f ubuntu12_32/steam 2>/dev/null || true
            pkill -f pressure-vessel 2>/dev/null || true
            pkill -f srt-client-container 2>/dev/null || true
            pkill -x steam 2>/dev/null || true
            sleep 3
            RTBASE="$HOME/.local/share/Steam/steamrt64/pv-runtime/steam-runtime-steamrt"
            PLAT=$(ls -d "$RTBASE"/steamrt*_platform_* 2>/dev/null | sort | tail -1)
            if [ -f "$HOME/.local/share/Steam/steamrt64/steam" ] && [ -n "$PLAT" ]; then
              # Run under the runtime's own ld.so with its library paths:
              # effectively inside SteamRT without the pressure-vessel container
              # (which snapshots libs into var/tmp-* before our seeding lands).
              RTLP="$PLAT/files/lib/x86_64-linux-gnu:$PLAT/files/usr/lib/x86_64-linux-gnu:$PLAT/files/lib64:$PLAT/files/usr/lib64:$PLAT/files/lib:$PLAT/files/usr/lib"
              LDSO=$(find "$PLAT/files" -name 'ld-linux-x86-64.so.2' 2>/dev/null | head -1)
              if [ -n "$LDSO" ]; then
                xvfb-run -a env STEAM_RUNTIME=1 PRESSURE_VESSEL_RUNTIME="$(basename "$PLAT")" LD_LIBRARY_PATH="$RTLP" LD_PRELOAD="$LIB" LD_DEBUG=libs "$LDSO" "$HOME/.local/share/Steam/steamrt64/steam" +login anonymous 2>&1 | tee -a steam-run.log &
              else
                echo "::warning::runtime ld.so not found; launching host with host ld.so"
                xvfb-run -a env LD_LIBRARY_PATH="$RTLP" LD_PRELOAD="$LIB" LD_DEBUG=libs "$HOME/.local/share/Steam/steamrt64/steam" +login anonymous 2>&1 | tee -a steam-run.log &
              fi
            else
              xvfb-run -a env PRESSURE_VESSEL_VERBOSE=1 STEAM_RUNTIME=0 LD_PRELOAD="$LIB" "$HOME/.local/share/Steam/ubuntu12_64/steam" +login anonymous 2>&1 | tee -a steam-run.log &
            fi
            STEAM_PID=$!
            for i in $(seq 1 48); do
              sleep 5
              if [ -f "$OMNISTEAM_CACHE_DIR/core_status.json" ]; then break; fi
            done
          fi
          if [ ! -f "$OMNISTEAM_CACHE_DIR/core_status.json" ]; then
            echo "::error::core_status.json never appeared (injection or host guard failed)"
            ps aux | grep -i "[s]team" | head -10 || true
            tail -30 steam-run.log 2>/dev/null || true
            find "$HOME/.local/share/Steam" -maxdepth 3 -name 'steamclient*.so' 2>/dev/null | head -5
            echo "--- runtime filesystem forensics ---"
            find "$HOME/.local/share/Steam" -name 'libcrypto.so*' 2>/dev/null
            ldd "$HOME/.local/share/Steam/steamrt64/steam" 2>&1 | head -15 || true
            echo "--- core .so glibc requirement ---"
            readelf --version-info "$HOME/.local/share/Steam/ubuntu12_64/libomnisteam.so" 2>/dev/null | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -4
            readelf -d "$HOME/.local/share/Steam/ubuntu12_64/libomnisteam.so" 2>/dev/null | grep NEEDED
            LDSO=$(find "$HOME/.local/share/Steam/steamrt64/pv-runtime" -name 'ld-linux-x86-64.so.2' 2>/dev/null | head -1)
            if [ -n "$LDSO" ]; then "$LDSO" --list "$HOME/.local/share/Steam/ubuntu12_64/libomnisteam.so" 2>&1 | head -12; fi
            LIBC=$(find "$HOME/.local/share/Steam/steamrt64/pv-runtime" -path '*files*' -name 'libc.so.6' 2>/dev/null | head -1)
            if [ -n "$LIBC" ]; then strings "$LIBC" | grep -E '^GLIBC_2\.[0-9.]+$' | sort -V | tail -2; fi
            strings "$HOME/.local/share/Steam/steamrt64/pv-runtime/steam-runtime-steamrt"/steamrt*_platform_*/files/lib/x86_64-linux-gnu/libc.so.6 2>/dev/null | grep -E '^GLIBC_2\.[0-9.]+$' | sort -V | tail -3
            ls "$HOME/.local/share/Steam/steamrt64/pv-runtime/steam-runtime-steamrt/" 2>/dev/null | head -12
            tail -40 "$HOME/.local/share/Steam/logs/omnisteam_core.log" 2>/dev/null || true
            cp "$HOME/.local/share/Steam/logs/omnisteam_core.log" omnisteam_core_linux.log 2>/dev/null || true
            tail -30 "$HOME/.local/share/Steam/logs/console-linux.txt" 2>/dev/null || true
            cp "$HOME/.local/share/Steam/logs/console-linux.txt" steam-container-console.log 2>/dev/null || true
            ls -la "$HOME/.local/share/Steam/logs/" 2>/dev/null | head -15 || true
            find "$HOME/.local/share/Steam" "$HOME/.steam" -path '*logs*' -name '*.txt' 2>/dev/null | head -12
            for L in $(find "$HOME/.local/share/Steam" "$HOME/.steam" -path '*logs*' -name 'console*.txt' 2>/dev/null | head -3); do echo "== $L =="; tail -25 "$L"; cp "$L" steam-container-console.log 2>/dev/null || true; done
            tail -25 "$HOME/.local/share/Steam/logs/bootstrap_log.txt" 2>/dev/null || true
            cp "$HOME/.local/share/Steam/logs/bootstrap_log.txt" steam-bootstrap-log.txt 2>/dev/null || true
            kill $STEAM_PID 2>/dev/null || true
            pkill -x steam 2>/dev/null || true
            pkill -f steamrt64/steam 2>/dev/null || true
            exit 1
          fi
          # Give the watch loop a couple of ticks to settle hook states.
          sleep 10
          cp "$OMNISTEAM_CACHE_DIR/core_status.json" core_status_linux.json
          cp "$HOME/.local/share/Steam/logs/omnisteam_core.log" omnisteam_core_linux.log 2>/dev/null || true
          cp "$HOME/.local/share/Steam/logs/console-linux.txt" steam-container-console.log 2>/dev/null || true
          kill $STEAM_PID 2>/dev/null || true
          pkill -x steam 2>/dev/null || true

      - name: Smoke gate
        run: python3 tools/smoke_status.py core_status_linux.json --platform linux --max-age 120

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-linux
          path: |
            omnisteam_core_linux.log
            core_status_linux.json
            steam-console.log
            steam-bootstrap.log
            steam-container-console.log
            steam-bootstrap-log.txt
            steam-run.log
          if-no-files-found: ignore

  macos-smoke:
    name: macOS Apple Silicon unlock-chain smoke (arm64 + Rosetta)
    runs-on: macos-latest
    # timeout-minutes includes runner QUEUE time; macos arm64 queues can be
    # long (first run never started inside a 45m budget).
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install curl ccache

      - name: Fetch current signatures from data branch
        run: |
          git fetch origin data
          mkdir -p smoke-cache
          git archive origin/data signatures | tar -x -C smoke-cache

      - name: Build universal core
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF \
            -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --config Release --parallel --target omnisteam_core
          nm build/lib/libomnisteam.dylib | grep -i interpose | head -6

      - name: Install Steam.app and bootstrap client files
        run: |
          curl -L -o steam.dmg https://steamcdn-a.akamaihd.net/client/installer/steam.dmg
          hdiutil attach steam.dmg -nobrowse -quiet
          VOL=$(ls -d /Volumes/Steam* | head -1)
          cp -R "$VOL/Steam.app" "$HOME/Applications/Steam.app" 2>/dev/null || {
            mkdir -p "$HOME/Applications"
            cp -R "$VOL/Steam.app" "$HOME/Applications/Steam.app"
          }
          hdiutil detach "$VOL" -quiet || true
          xattr -dr com.apple.quarantine "$HOME/Applications/Steam.app" 2>/dev/null || true
          # Register with LaunchServices: the updater relaunches Steam via
          # `open` after installing updates; an unregistered app never starts.
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$HOME/Applications/Steam.app" || true
          # First launch downloads the real client (steamclient.dylib etc.).
          # Inject here too: LaunchServices is broken on headless runners, so
          # the updater's open -n hop needs the interposer rewrite to finish
          # the install cleanly (otherwise every smoke launch redoes the update).
          ILIB="$PWD/$(find build -name 'libomnisteam.dylib' | head -1)"
          OMNISTEAM_FORCE_DIRECT_SPAWN=1 DYLD_INSERT_LIBRARIES="$ILIB" \
            "$HOME/Applications/Steam.app/Contents/MacOS/steam_osx" & APP_PID=$!
          for i in $(seq 1 60); do
            sleep 5
            if grep -q "Update complete, launching Steam" "$HOME/Library/Application Support/Steam/logs/bootstrap_log.txt" 2>/dev/null; then
              sleep 15
              break
            fi
          done
          # The client never runs (LaunchServices dead), so it never writes
          # the .installed manifest and every later launch reinstalls the
          # package in updater mode. Seed it from the package manifest.
          PKG="$HOME/Library/Application Support/Steam/Steam.AppBundle/Steam/Contents/MacOS/package"
          for M in "$PKG"/steam_client_*_osx; do
            [ -f "$M" ] && cp "$M" "$M.installed" 2>/dev/null || true
          done
          kill $APP_PID 2>/dev/null || true
          # The bootstrap re-execs and spawns children under new pids; kill
          # the whole tree or a leftover host holds the single-instance lock
          # and the injected smoke launch silently hands off to it.
          pkill -x steam_osx 2>/dev/null || true
          for i in $(seq 1 15); do pgrep -x steam_osx >/dev/null 2>&1 || break; sleep 2; done
          pkill -9 -x steam_osx 2>/dev/null || true
          sleep 2
          xattr -dr com.apple.quarantine "$HOME/Library/Application Support/Steam" 2>/dev/null || true
          find "$HOME/Library/Application Support/Steam" -name 'steamclient*.dylib' | head -3

      - name: Native arm64 injection smoke
        env:
          OMNISTEAM_CACHE_DIR: ${{ github.workspace }}/smoke-cache
        run: |
          # ABSOLUTE path: steam_osx re-execs into Steam.AppBundle and dyld
          # resolves relative insert paths against the NEW cwd (first run
          # proved insertion survives SIP + re-exec, only the path was wrong).
          LIB="$PWD/$(find build -name 'libomnisteam.dylib' | head -1)"
          echo "Injecting $LIB"
          # The final-host hop (new pid, sanitized env) is handled by the
          # core's SpawnInterpose (src/Platform/Darwin/SpawnInterpose.cpp):
          # dyld interposers on posix_spawn/execve re-add this dylib to every
          # child env from inside the intermediate process. Binary wrappers
          # are NOT used - Steam's package integrity repair reverts them
          # (run 44077660460).
          pkill -9 -x steam_osx 2>/dev/null || true
          sleep 2
          # The updater's final hop goes /bin/sh -> open -> LaunchServices ->
          # launchd, which builds a FRESH env (DYLD dropped, interposers cannot
          # reach it). launchctl setenv makes launchd itself add the dylib to
          # every session-launched process; the host guard keeps others inert.
          launchctl setenv DYLD_INSERT_LIBRARIES "$LIB"
          # Headless LaunchServices probes: plain open vs asuser (GUI domain).
          sudo spctl --master-disable 2>/dev/null || true
          open -a TextEdit 2>open-test.err || true
          sleep 3
          if pgrep -x TextEdit >/dev/null 2>&1; then echo "LaunchServices: OK"; else echo "LaunchServices: BROKEN"; cat open-test.err; fi
          pkill -x TextEdit 2>/dev/null || true
          sudo launchctl asuser "$(id -u)" open -a TextEdit 2>open-asuser.err || true
          sleep 3
          if pgrep -x TextEdit >/dev/null 2>&1; then echo "LaunchServices asuser: OK"; else echo "LaunchServices asuser: BROKEN"; cat open-asuser.err; fi
          pkill -x TextEdit 2>/dev/null || true
          # Package re-extraction re-applies quarantine xattrs; keep stripping
          # them during the smoke window so the exec fallback is not ASP-killed.
          ( for i in $(seq 1 240); do xattr -dr com.apple.quarantine "$HOME/Library/Application Support/Steam" "$HOME/Applications/Steam.app" 2>/dev/null; sleep 1; done ) >/dev/null 2>&1 &
          pkill -x TextEdit 2>/dev/null || true
          # CI escape hatch: rewrite the updater's `open -n` spawn into a direct
          strings "$HOST" 2>/dev/null | grep -iE "launchcontext|clientmode|updatermode|runasclient|forceclient|steamupdate" | head -8 || true
          # exec (env-preserving) inside SpawnInterpose; product default is off.
          export OMNISTEAM_FORCE_DIRECT_SPAWN=1
          # The bootstrapper self-update leaves Steam.app invalid (binary
          # missing, spctl: 'invalid API object reference', run 44233479624).
          # Launch the AppBundle host directly - steamclient.dylib sits next
          # to it; no bootstrap chain / LaunchServices needed for the smoke.
          HOST="$HOME/Library/Application Support/Steam/Steam.AppBundle/Steam/Contents/MacOS/steam_osx"
          ls -la "$HOME/Applications/Steam.app/Contents/MacOS/" 2>/dev/null | head -6 || true
          pkill -9 -x ipcserver 2>/dev/null || true
          xattr -dr com.apple.quarantine "$HOME/Library/Application Support/Steam" 2>/dev/null || true
          # RE finding (Ghidra decompile of steam_osx): -inhibitbootstrap makes
          # the flag parser set inhibit+skipverify+skiprepair, bypassing the
          # updater phase that loops on headless runners. steam.cfg with
          # BootStrapperInhibitAll is the config-file equivalent (belt+braces).
          printf 'BootStrapperInhibitAll enable\nBootStrapperInhibitUpdateOnLaunch enable\n' > "$(dirname "$HOST")/steam.cfg"
          ( DYLD_INSERT_LIBRARIES="$LIB" DYLD_PRINT_LIBRARIES=1 "$HOST" -inhibitbootstrap -skipinitialbootstrap; echo "steam_osx exit code: $?" ) 2>&1 | tee steam-console-arm64.log &
          APP_PID=$!
          for i in $(seq 1 36); do
            sleep 5
            if [ -f smoke-cache/core_status.json ]; then break; fi
            if [ $((i % 12)) -eq 0 ]; then
              echo "--- arm64 progress $((i*5))s ---"
              ps aux | grep -i "[s]team" | head -6 || true
            fi
          done
          if [ ! -f smoke-cache/core_status.json ]; then
            echo "::error::arm64: core_status.json never appeared - DYLD insertion stripped (SIP/library validation?) or funchook mprotect failed"
            ls -t "$HOME/Library/Logs/DiagnosticReports/" 2>/dev/null | head -5 || true
            CRASH=$(ls -t "$HOME/Library/Logs/DiagnosticReports/"steam_osx* 2>/dev/null | head -1 || true)
            if [ -n "$CRASH" ]; then head -60 "$CRASH"; cp "$CRASH" steam-crash-report.ips; fi
            ps aux | grep -i "[s]team" | head -10 || true
            tail -10 /tmp/omni-spawn-fallback.log 2>/dev/null || true
            tail -40 "$HOME/Library/Application Support/Steam/logs/omnisteam_core.log" 2>/dev/null || true
            tail -25 "$HOME/Library/Application Support/Steam/logs/bootstrap_log.txt" 2>/dev/null || true
            cp "$HOME/Library/Application Support/Steam/logs/bootstrap_log.txt" steam-bootstrap-log.txt 2>/dev/null || true
            cp "$HOME/Library/Application Support/Steam/logs/omnisteam_core.log" omnisteam_core_macos.log 2>/dev/null || true
            kill $APP_PID 2>/dev/null || true
            launchctl unsetenv DYLD_INSERT_LIBRARIES 2>/dev/null || true
            exit 1
          fi
          sleep 10
          cp smoke-cache/core_status.json core_status_macos_arm64.json
          cp "$HOME/Library/Application Support/Steam/logs/omnisteam_core.log" omnisteam_core_macos.log 2>/dev/null || true
          kill $APP_PID 2>/dev/null || true
          pkill -x steam_osx 2>/dev/null || true
          launchctl unsetenv DYLD_INSERT_LIBRARIES 2>/dev/null || true
          python3 tools/smoke_status.py core_status_macos_arm64.json --platform macos --max-age 120

      - name: Rosetta 2 x86_64 injection smoke
        env:
          OMNISTEAM_CACHE_DIR: ${{ github.workspace }}/smoke-cache-rosetta
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::warning::Rosetta 2 unavailable on this runner; skipping x86_64 probe"
            exit 0
          fi
          mkdir -p smoke-cache-rosetta
          cp -R smoke-cache/signatures smoke-cache-rosetta/
          LIB="$PWD/$(find build -name 'libomnisteam.dylib' | head -1)"
          pkill -9 -x steam_osx 2>/dev/null || true
          sleep 2
          launchctl setenv DYLD_INSERT_LIBRARIES "$LIB"
          export OMNISTEAM_FORCE_DIRECT_SPAWN=1
          xattr -dr com.apple.quarantine "$HOME/Library/Application Support/Steam" 2>/dev/null || true
          pkill -9 -x ipcserver 2>/dev/null || true
          ( arch -x86_64 /usr/bin/env DYLD_INSERT_LIBRARIES="$LIB" \
              "$HOME/Library/Application Support/Steam/Steam.AppBundle/Steam/Contents/MacOS/steam_osx" -inhibitbootstrap -skipinitialbootstrap; echo "steam_osx x64 exit code: $?" ) 2>&1 | tee steam-console-x64.log &
          APP_PID=$!
          for i in $(seq 1 36); do
            sleep 5
            if [ -f smoke-cache-rosetta/core_status.json ]; then break; fi
          done
          if [ ! -f smoke-cache-rosetta/core_status.json ]; then
            echo "::error::Rosetta x86_64: core_status.json never appeared"
            ps aux | grep -i "[s]team" | head -10 || true
            tail -10 /tmp/omni-spawn-fallback.log 2>/dev/null || true
            CRASH=$(ls -t "$HOME/Library/Logs/DiagnosticReports/"steam_osx* 2>/dev/null | head -1 || true)
            cp "$HOME/Library/Application Support/Steam/logs/omnisteam_core.log" omnisteam_core_macos.log 2>/dev/null || true
            kill $APP_PID 2>/dev/null || true
            launchctl unsetenv DYLD_INSERT_LIBRARIES 2>/dev/null || true
            exit 1
          fi
          sleep 10
          cp smoke-cache-rosetta/core_status.json core_status_macos_x64.json
          cp "$HOME/Library/Application Support/Steam/logs/omnisteam_core.log" omnisteam_core_macos.log 2>/dev/null || true
          kill $APP_PID 2>/dev/null || true
          pkill -x steam_osx 2>/dev/null || true
          launchctl unsetenv DYLD_INSERT_LIBRARIES 2>/dev/null || true
          python3 tools/smoke_status.py core_status_macos_x64.json --platform macos --max-age 120

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-macos
          path: |
            core_status_macos_arm64.json
            core_status_macos_x64.json
            steam-console-arm64.log
            steam-console-x64.log
            omnisteam_core_macos.log
            steam-bootstrap-log.txt
            steam-crash-report.ips
          if-no-files-found: ignore

  windows-smoke:
    name: Windows x64 unlock-chain smoke + alias probe
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build core + proxy DLL
        run: |
          cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build build --config Release --parallel --target omnisteam_core xinput1_4

      - name: Extract Steam bootstrap (NSIS install hangs on CI)
        run: |
          curl -fsSL -o SteamSetup.exe https://steamcdn-a.akamaihd.net/client/installer/SteamSetup.exe
          # The NSIS silent installer hangs / never lands files on hosted
          # runners; 7z extraction yields the same bootstrap deterministically.
          7z x SteamSetup.exe -osteam-root -y > /dev/null
          [ -f steam-root/steam.exe ] || { echo "::error::steam.exe missing after extraction"; find steam-root -maxdepth 2 | head -30; exit 1; }

      - name: Fetch current signatures from data branch
        run: |
          git fetch origin data
          mkdir -p smoke-cache
          git archive origin/data signatures | tar -x -C smoke-cache

      - name: Deploy proxy and launch Steam
        run: |
          CORE=$(find build -name 'libomnisteam.dll' | head -1)
          PROXY=$(find build -name 'xinput1_4.dll' | head -1)
          [ -n "$CORE" ] && [ -n "$PROXY" ] || { echo "::error::core/proxy artifacts missing"; exit 1; }
          cp "$CORE" "$PROXY" "$PWD/steam-root/"
          export OMNISTEAM_CACHE_DIR=$(cygpath -m "$PWD/smoke-cache")
          echo "cache dir: $OMNISTEAM_CACHE_DIR"
          "$PWD/steam-root/steam.exe" &
          for i in $(seq 1 120); do
            sleep 5
            if [ -f smoke-cache/core_status.json ]; then break; fi
          done
          if [ ! -f smoke-cache/core_status.json ]; then
            echo "::error::core_status.json never appeared (proxy load or host guard failed)"
            exit 1
          fi
          sleep 10
          tasklist | grep -i steam.exe || { echo "::error::Steam died after hooking (alias crash?)"; exit 1; }
          cp smoke-cache/core_status.json core_status_windows.json

      - name: Static GetOrAddAppData alias probe
        run: |
          python -m pip install capstone
          for i in $(seq 1 36); do
            [ -f steam-root/steamclient64.dll ] && break
            sleep 5
          done
          [ -f steam-root/steamclient64.dll ] || { echo "::error::steamclient64.dll never downloaded"; exit 1; }
          python tools/verify_appdata_alias.py \
            --binary "$PWD/steam-root/steamclient64.dll" \
            --signatures-dir smoke-cache/signatures/windows-x64

      - name: Smoke gate
        run: python tools/smoke_status.py core_status_windows.json --platform windows --max-age 120

      - name: Shutdown Steam
        if: always()
        run: taskkill //F //IM steam.exe //T 2>/dev/null || true

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-windows
          path: |
            core_status_windows.json
            smoke-cache/omnisteam.log
          if-no-files-found: ignore