name: Hook Smoke (real-machine unlock chain)

# ROADMAP P0.1/P0.2 substitute for local real machines:
# - Linux: genuine x86_64 kernel on the ubuntu runner; Steam runs under Xvfb
#   with LD_PRELOAD injection, then tools/smoke_status.py gates core_status.json.
# - macOS: macos-14 runners are REAL Apple Silicon hardware. Verifies both the
#   native arm64 slice and the Rosetta 2 x86_64 path (funchook mprotect EINVAL
#   question, ROADMAP §2.8).
# - Windows: proxy-DLL injection into the real client; additionally runs the
#   static GetOrAddAppData alias shape probe (tools/verify_appdata_alias.py)
#   against steamclient64.dll before the dynamic gate.
# Draft status: first runs may expose runner-specific Steam bootstrap issues;
# artifacts (core_status.json + client logs) are uploaded for triage.

on:
  workflow_dispatch:
  schedule:
    # Mondays 05:00 UTC, after the 03:00 signature harvest refreshes `data`.
    - cron: "0 5 * * 1"
  push:
    branches: [ main ]
    paths:
      - 'src/Hook/**'
      - 'src/Utils/Metadata/**'
      - 'src/main.cpp'
      - 'tools/smoke_status.py'
      - 'tools/verify_appdata_alias.py'
      - '.github/workflows/hook-smoke.yml'

concurrency:
  group: hook-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-smoke:
    name: Linux x86_64 unlock-chain smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      OMNISTEAM_CACHE_DIR: ${{ github.workspace }}/smoke-cache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build + Steam runtime dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          # Build deps are HARD requirements: a silent apt failure here once
          # left CURL missing and broke CMake configure downstream.
          sudo apt-get install -y libssl-dev libcurl4-openssl-dev ccache xvfb xauth
          # Steam runtime libs are best-effort (package names drift across
          # Ubuntu releases; libgconf-2-4 no longer exists on noble).
          sudo apt-get install -y lib32gcc-s1 lib32stdc++6 libc6:i386 libgl1:i386 \
            libx11-6:i386 libxext6:i386 libxrandr2:i386 libxinerama1:i386 libxi6:i386 \
            libxcursor1:i386 libxss1:i386 libdbus-1-3:i386 \
            libfreetype6:i386 libfontconfig1:i386 libnm0:i386 || true

      - name: Enable unprivileged user namespaces (SteamRT requirement)
        run: |
          # Ubuntu 24.04 AppArmor restricts unprivileged userns by default;
          # SteamRT/pressure-vessel needs them (zenity error, run 44086929463).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Fetch current signatures from data branch
        run: |
          git fetch origin data
          mkdir -p "$OMNISTEAM_CACHE_DIR"
          git archive origin/data signatures | tar -x -C "$OMNISTEAM_CACHE_DIR"

      - name: Build core
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --config Release --parallel 2 --target omnisteam_core

      - name: Install Steam launcher
        run: |
          # Canonical stable launcher deb; the pool-listing scrape 404'd when
          # the newest entry vanished between listing and fetch.
          curl -fsSL -o steam-launcher.deb https://repo.steampowered.com/steam/archive/precise/steam_latest.deb
          sudo dpkg -i steam-launcher.deb || sudo apt-get -f install -y

      - name: Launch Steam under Xvfb with LD_PRELOAD injection
        run: |
          export GTK_A11Y=none
          LIB=$(find "$PWD/build" -name 'libomnisteam.so' | head -1)
          [ -n "$LIB" ] || { echo "::error::libomnisteam.so not built"; exit 1; }
          # SteamRT (pressure-vessel) drops LD_PRELOAD entries whose paths are
          # invisible inside the container; the workspace is not shared but
          # ~/.local/share/Steam is. Deploy to the production location so the
          # preload survives the container exec (run 44072592116: core init in
          # the steamrt64/steam wrapper, silence after the container hop).
          mkdir -p "$HOME/.local/share/Steam/ubuntu12_64"
          cp "$LIB" "$HOME/.local/share/Steam/ubuntu12_64/libomnisteam.so"
          LIB="$HOME/.local/share/Steam/ubuntu12_64/libomnisteam.so"
          echo "Injecting $LIB"
          have_host() {
            [ -f "$HOME/.local/share/Steam/steamrt64/steam" ] || [ -f "$HOME/.local/share/Steam/ubuntu12_64/steam" ]
          }
          # The /usr/bin/steam launcher blocks forever in steamdeps on headless
          # runners (interactive dependency prompt; 0 CPU for 8 minutes in run
          # 44067569389). Extract the bootstrap the launcher would have copied
          # and run steam.sh directly. LD_PRELOAD stays scoped to the Steam
          # pipeline so CI diagnostic commands don't load the core.
          mkdir -p "$HOME/.local/share/Steam"
          # Bootstrap location differs between launcher deb vintages; discover
          # it from the package manifest instead of hardcoding a path.
          dpkg -L steam-launcher | grep -E '\.(sh|tar|gz|xz)$' | head -10
          BOOT=$(dpkg -L steam-launcher | grep -E 'bootstrap.*\.tar' | head -1)
          if [ -n "$BOOT" ] && [ -f "$BOOT" ]; then
            tar -xf "$BOOT" -C "$HOME/.local/share/Steam"
            yes | xvfb-run -a "$HOME/.local/share/Steam/steam.sh" +login anonymous 2>&1 | tee steam-bootstrap.log &
          else
            yes | xvfb-run -a steam +login anonymous 2>&1 | tee steam-bootstrap.log &
          fi
          BOOT_PID=$!
          # Phase 1: let the 32-bit bootstrap download the 64-bit client.
          # setup.sh's runtime update can hang headless (zenity/srt); watch
          # progress and fall back to running the bootstrap binary directly.
          for i in $(seq 1 96); do
            have_host && break
            if [ $((i % 6)) -eq 0 ]; then
              echo "--- bootstrap progress $((i*5))s ---"
              ps aux | grep -E "[s]team|[z]enity|[c]url|[s]rt-" | head -8 || true
            fi
            sleep 5
          done
          if ! have_host; then
            echo "--- steam.sh stalled; trying the 32-bit bootstrap directly ---"
            kill $BOOT_PID 2>/dev/null || true
            pkill -f steam.sh 2>/dev/null || true
            pkill -f setup.sh 2>/dev/null || true
            sleep 2
            if [ -f "$HOME/.local/share/Steam/ubuntu12_32/steam" ]; then
              xvfb-run -a "$HOME/.local/share/Steam/ubuntu12_32/steam" +login anonymous 2>&1 | tee -a steam-bootstrap.log &
              BOOT_PID=$!
              for i in $(seq 1 24); do
                have_host && break
                sleep 5
              done
            fi
          fi
          if ! have_host; then
            echo "::error::64-bit client never downloaded"
            tail -30 steam-bootstrap.log 2>/dev/null || true
            kill $BOOT_PID 2>/dev/null || true
            exit 1
          fi
          # Phase 2: relaunch the 64-bit host with injection. Modern clients
          # live in steamrt64/ (pressure-vessel container); with userns enabled
          # the container starts properly and may keep container-visible
          # LD_PRELOAD entries. Older layouts: ubuntu12_64 + STEAM_RUNTIME=0.
          # Kill EVERY phase-1 process first: a leftover host holds the
          # single-instance lock and the injected launch just hands off to it.
          kill $BOOT_PID 2>/dev/null || true
          pkill -f steam.sh 2>/dev/null || true
          pkill -f ubuntu12_32/steam 2>/dev/null || true
          pkill -f pressure-vessel 2>/dev/null || true
          pkill -f srt-client-container 2>/dev/null || true
          pkill -x steam 2>/dev/null || true
          sleep 3
          if [ -f "$HOME/.local/share/Steam/steamrt64/steam" ]; then
            xvfb-run -a env LD_PRELOAD="$LIB" "$HOME/.local/share/Steam/steamrt64/steam" +login anonymous 2>&1 | tee steam-run.log &
          else
            xvfb-run -a env STEAM_RUNTIME=0 LD_PRELOAD="$LIB" "$HOME/.local/share/Steam/ubuntu12_64/steam" +login anonymous 2>&1 | tee steam-run.log &
          fi
          STEAM_PID=$!
          for i in $(seq 1 96); do
            sleep 5
            if [ -f "$OMNISTEAM_CACHE_DIR/core_status.json" ]; then break; fi
            if [ $((i % 12)) -eq 0 ]; then
              echo "--- progress $((i*5))s ---"
              ps aux | grep -i "[s]team" | head -5 || true
              find "$HOME/.local/share/Steam" -maxdepth 3 -name 'steamclient*.so' 2>/dev/null | head -3
            fi
          done
          if [ ! -f "$OMNISTEAM_CACHE_DIR/core_status.json" ]; then
            echo "::error::core_status.json never appeared (injection or host guard failed)"
            ps aux | grep -i "[s]team" | head -10 || true
            find "$HOME/.local/share/Steam" -maxdepth 3 -name 'steamclient*.so' 2>/dev/null | head -5
            tail -40 "$HOME/.local/share/Steam/logs/omnisteam_core.log" 2>/dev/null || true
            cp "$HOME/.local/share/Steam/logs/omnisteam_core.log" omnisteam_core_linux.log 2>/dev/null || true
            tail -30 "$HOME/.local/share/Steam/logs/console-linux.txt" 2>/dev/null || true
            cp "$HOME/.local/share/Steam/logs/console-linux.txt" steam-container-console.log 2>/dev/null || true
            ls -la "$HOME/.local/share/Steam/logs/" 2>/dev/null | head -15 || true
            tail -25 "$HOME/.local/share/Steam/logs/bootstrap_log.txt" 2>/dev/null || true
            cp "$HOME/.local/share/Steam/logs/bootstrap_log.txt" steam-bootstrap-log.txt 2>/dev/null || true
            kill $STEAM_PID 2>/dev/null || true
            exit 1
          fi
          # Give the watch loop a couple of ticks to settle hook states.
          sleep 10
          cp "$OMNISTEAM_CACHE_DIR/core_status.json" core_status_linux.json
          cp "$HOME/.local/share/Steam/logs/omnisteam_core.log" omnisteam_core_linux.log 2>/dev/null || true
          cp "$HOME/.local/share/Steam/logs/console-linux.txt" steam-container-console.log 2>/dev/null || true
          kill $STEAM_PID 2>/dev/null || true
          pkill -x steam 2>/dev/null || true

      - name: Smoke gate
        run: python3 tools/smoke_status.py core_status_linux.json --platform linux --max-age 120

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-linux
          path: |
            omnisteam_core_linux.log
            core_status_linux.json
            steam-console.log
            steam-bootstrap.log
            steam-container-console.log
            steam-bootstrap-log.txt
          if-no-files-found: ignore

  macos-smoke:
    name: macOS Apple Silicon unlock-chain smoke (arm64 + Rosetta)
    runs-on: macos-latest
    # timeout-minutes includes runner QUEUE time; macos arm64 queues can be
    # long (first run never started inside a 45m budget).
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install curl ccache

      - name: Fetch current signatures from data branch
        run: |
          git fetch origin data
          mkdir -p smoke-cache
          git archive origin/data signatures | tar -x -C smoke-cache

      - name: Build universal core
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF \
            -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --config Release --parallel --target omnisteam_core
          nm build/lib/libomnisteam.dylib | grep -i interpose | head -6

      - name: Install Steam.app and bootstrap client files
        run: |
          curl -L -o steam.dmg https://steamcdn-a.akamaihd.net/client/installer/steam.dmg
          hdiutil attach steam.dmg -nobrowse -quiet
          VOL=$(ls -d /Volumes/Steam* | head -1)
          cp -R "$VOL/Steam.app" "$HOME/Applications/Steam.app" 2>/dev/null || {
            mkdir -p "$HOME/Applications"
            cp -R "$VOL/Steam.app" "$HOME/Applications/Steam.app"
          }
          hdiutil detach "$VOL" -quiet || true
          # First launch downloads the real client (steamclient.dylib etc.).
          "$HOME/Applications/Steam.app/Contents/MacOS/steam_osx" & APP_PID=$!
          for i in $(seq 1 24); do
            sleep 10
            if find "$HOME/Library/Application Support/Steam" -name 'steamclient*.dylib' 2>/dev/null | grep -q .; then
              break
            fi
          done
          kill $APP_PID 2>/dev/null || true
          # The bootstrap re-execs and spawns children under new pids; kill
          # the whole tree or a leftover host holds the single-instance lock
          # and the injected smoke launch silently hands off to it.
          pkill -x steam_osx 2>/dev/null || true
          for i in $(seq 1 15); do pgrep -x steam_osx >/dev/null 2>&1 || break; sleep 2; done
          pkill -9 -x steam_osx 2>/dev/null || true
          sleep 2
          find "$HOME/Library/Application Support/Steam" -name 'steamclient*.dylib' | head -3

      - name: Native arm64 injection smoke
        env:
          OMNISTEAM_CACHE_DIR: ${{ github.workspace }}/smoke-cache
        run: |
          # ABSOLUTE path: steam_osx re-execs into Steam.AppBundle and dyld
          # resolves relative insert paths against the NEW cwd (first run
          # proved insertion survives SIP + re-exec, only the path was wrong).
          LIB="$PWD/$(find build -name 'libomnisteam.dylib' | head -1)"
          echo "Injecting $LIB"
          # The final-host hop (new pid, sanitized env) is handled by the
          # core's SpawnInterpose (src/Platform/Darwin/SpawnInterpose.cpp):
          # dyld interposers on posix_spawn/execve re-add this dylib to every
          # child env from inside the intermediate process. Binary wrappers
          # are NOT used - Steam's package integrity repair reverts them
          # (run 44077660460).
          pkill -9 -x steam_osx 2>/dev/null || true
          sleep 2
          DYLD_INSERT_LIBRARIES="$LIB" DYLD_PRINT_LIBRARIES=1 \
            "$HOME/Applications/Steam.app/Contents/MacOS/steam_osx" 2>&1 | tee steam-console-arm64.log &
          APP_PID=$!
          for i in $(seq 1 36); do
            sleep 5
            if [ -f smoke-cache/core_status.json ]; then break; fi
            if [ $((i % 12)) -eq 0 ]; then
              echo "--- arm64 progress $((i*5))s ---"
              ps aux | grep -i "[s]team" | head -6 || true
            fi
          done
          if [ ! -f smoke-cache/core_status.json ]; then
            echo "::error::arm64: core_status.json never appeared - DYLD insertion stripped (SIP/library validation?) or funchook mprotect failed"
            ls -t "$HOME/Library/Logs/DiagnosticReports/" 2>/dev/null | head -5 || true
            CRASH=$(ls -t "$HOME/Library/Logs/DiagnosticReports/"steam_osx* 2>/dev/null | head -1 || true)
            if [ -n "$CRASH" ]; then head -60 "$CRASH"; cp "$CRASH" steam-crash-report.ips; fi
            ps aux | grep -i "[s]team" | head -10 || true
            tail -40 "$HOME/Library/Application Support/Steam/logs/omnisteam_core.log" 2>/dev/null || true
            tail -25 "$HOME/Library/Application Support/Steam/logs/bootstrap_log.txt" 2>/dev/null || true
            cp "$HOME/Library/Application Support/Steam/logs/bootstrap_log.txt" steam-bootstrap-log.txt 2>/dev/null || true
            cp "$HOME/Library/Application Support/Steam/logs/omnisteam_core.log" omnisteam_core_macos.log 2>/dev/null || true
            kill $APP_PID 2>/dev/null || true
            exit 1
          fi
          sleep 10
          cp smoke-cache/core_status.json core_status_macos_arm64.json
          cp "$HOME/Library/Application Support/Steam/logs/omnisteam_core.log" omnisteam_core_macos.log 2>/dev/null || true
          kill $APP_PID 2>/dev/null || true
          pkill -x steam_osx 2>/dev/null || true
          python3 tools/smoke_status.py core_status_macos_arm64.json --platform macos --max-age 120

      - name: Rosetta 2 x86_64 injection smoke
        env:
          OMNISTEAM_CACHE_DIR: ${{ github.workspace }}/smoke-cache-rosetta
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::warning::Rosetta 2 unavailable on this runner; skipping x86_64 probe"
            exit 0
          fi
          mkdir -p smoke-cache-rosetta
          cp -R smoke-cache/signatures smoke-cache-rosetta/
          LIB="$PWD/$(find build -name 'libomnisteam.dylib' | head -1)"
          pkill -9 -x steam_osx 2>/dev/null || true
          sleep 2
          arch -x86_64 /usr/bin/env DYLD_INSERT_LIBRARIES="$LIB" \
            "$HOME/Applications/Steam.app/Contents/MacOS/steam_osx" 2>&1 | tee steam-console-x64.log &
          APP_PID=$!
          for i in $(seq 1 36); do
            sleep 5
            if [ -f smoke-cache-rosetta/core_status.json ]; then break; fi
          done
          if [ ! -f smoke-cache-rosetta/core_status.json ]; then
            echo "::error::Rosetta x86_64: core_status.json never appeared"
            ps aux | grep -i "[s]team" | head -10 || true
            CRASH=$(ls -t "$HOME/Library/Logs/DiagnosticReports/"steam_osx* 2>/dev/null | head -1 || true)
            cp "$HOME/Library/Application Support/Steam/logs/omnisteam_core.log" omnisteam_core_macos.log 2>/dev/null || true
            kill $APP_PID 2>/dev/null || true
            exit 1
          fi
          sleep 10
          cp smoke-cache-rosetta/core_status.json core_status_macos_x64.json
          cp "$HOME/Library/Application Support/Steam/logs/omnisteam_core.log" omnisteam_core_macos.log 2>/dev/null || true
          kill $APP_PID 2>/dev/null || true
          pkill -x steam_osx 2>/dev/null || true
          python3 tools/smoke_status.py core_status_macos_x64.json --platform macos --max-age 120

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-macos
          path: |
            core_status_macos_arm64.json
            core_status_macos_x64.json
            steam-console-arm64.log
            steam-console-x64.log
            omnisteam_core_macos.log
            steam-bootstrap-log.txt
            steam-crash-report.ips
          if-no-files-found: ignore

  windows-smoke:
    name: Windows x64 unlock-chain smoke + alias probe
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build core + proxy DLL
        run: |
          cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build build --config Release --parallel --target omnisteam_core xinput1_4

      - name: Extract Steam bootstrap (NSIS install hangs on CI)
        run: |
          curl -fsSL -o SteamSetup.exe https://steamcdn-a.akamaihd.net/client/installer/SteamSetup.exe
          # The NSIS silent installer hangs / never lands files on hosted
          # runners; 7z extraction yields the same bootstrap deterministically.
          7z x SteamSetup.exe -osteam-root -y > /dev/null
          [ -f steam-root/steam.exe ] || { echo "::error::steam.exe missing after extraction"; find steam-root -maxdepth 2 | head -30; exit 1; }

      - name: Fetch current signatures from data branch
        run: |
          git fetch origin data
          mkdir -p smoke-cache
          git archive origin/data signatures | tar -x -C smoke-cache

      - name: Deploy proxy and launch Steam
        run: |
          CORE=$(find build -name 'libomnisteam.dll' | head -1)
          PROXY=$(find build -name 'xinput1_4.dll' | head -1)
          [ -n "$CORE" ] && [ -n "$PROXY" ] || { echo "::error::core/proxy artifacts missing"; exit 1; }
          cp "$CORE" "$PROXY" "$PWD/steam-root/"
          export OMNISTEAM_CACHE_DIR=$(cygpath -m "$PWD/smoke-cache")
          echo "cache dir: $OMNISTEAM_CACHE_DIR"
          "$PWD/steam-root/steam.exe" &
          for i in $(seq 1 120); do
            sleep 5
            if [ -f smoke-cache/core_status.json ]; then break; fi
          done
          if [ ! -f smoke-cache/core_status.json ]; then
            echo "::error::core_status.json never appeared (proxy load or host guard failed)"
            exit 1
          fi
          sleep 10
          tasklist | grep -i steam.exe || { echo "::error::Steam died after hooking (alias crash?)"; exit 1; }
          cp smoke-cache/core_status.json core_status_windows.json

      - name: Static GetOrAddAppData alias probe
        run: |
          python -m pip install capstone
          for i in $(seq 1 36); do
            [ -f steam-root/steamclient64.dll ] && break
            sleep 5
          done
          [ -f steam-root/steamclient64.dll ] || { echo "::error::steamclient64.dll never downloaded"; exit 1; }
          python tools/verify_appdata_alias.py \
            --binary "$PWD/steam-root/steamclient64.dll" \
            --signatures-dir smoke-cache/signatures/windows-x64

      - name: Smoke gate
        run: python tools/smoke_status.py core_status_windows.json --platform windows --max-age 120

      - name: Shutdown Steam
        if: always()
        run: taskkill //F //IM steam.exe //T 2>/dev/null || true

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-windows
          path: |
            core_status_windows.json
            smoke-cache/omnisteam.log
          if-no-files-found: ignore