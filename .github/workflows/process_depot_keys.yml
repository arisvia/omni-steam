name: Sync and Process Depot Keys

on:
  schedule:
    # Every Sunday 02:00 UTC - sync upstream keys and refresh single-commit data branch
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      upstream_urls:
        description: 'Space-separated external key sources (JSON / VDF / KV)'
        required: false
        default: ''
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  sync-and-merge:
    name: Sync & Merge Depot Keys
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'depot-key-submission') || startsWith(github.event.issue.title, '[DepotKey]')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Fetch Baseline data Branch (Preserving Signatures)
        run: |
          # Checkout or fetch full data branch so signatures/ and depotkeys.bin can be preserved together
          git fetch origin data:data 2>/dev/null || true
          if git show-ref --verify --quiet refs/heads/data; then
            git checkout data -- signatures/ 2>/dev/null || true
            git checkout data -- depotkeys.bin 2>/dev/null || true
          fi
          if [ ! -f depotkeys.bin ]; then
            echo "Fetching depotkeys.bin baseline from CDN..."
            curl -fsSL -o depotkeys.bin "https://raw.githubusercontent.com/arisvia/omni-steam/data/depotkeys.bin" || \
            curl -fsSL -o depotkeys.bin "https://cdn.jsdelivr.net/gh/arisvia/omni-steam@data/depotkeys.bin" || \
            echo "No existing depotkeys.bin found, initializing new."
          fi

      - name: Sync from Upstream Sources (Scheduled / Manual)
        id: sync_upstream
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          SOURCES="${{ inputs.upstream_urls }}"
          python tools/depot_key_tool.py merge_sources depotkeys.bin $SOURCES > /tmp/sync_output.txt
          cat /tmp/sync_output.txt
          MODIFIED=$(git status --porcelain depotkeys.bin | wc -l)
          echo "modified=$MODIFIED" >> $GITHUB_OUTPUT

      - name: Save Issue Content
        if: github.event_name == 'issues'
        run: |
          cat << 'EOF' > /tmp/issue_body.md
          ${{ github.event.issue.body }}
          EOF

      - name: Validate & Merge Key from Issue
        id: process_key
        if: github.event_name == 'issues'
        run: |
          python tools/process_issue_key.py /tmp/issue_body.md depotkeys.bin > /tmp/process_output.txt 2>&1 || true
          cat /tmp/process_output.txt
          
          RESULT=$(grep "RESULT:" /tmp/process_output.txt | cut -d':' -f2 || echo "UNKNOWN")
          echo "result=$RESULT" >> $GITHUB_OUTPUT
          
          GAME_TITLE=$(grep "GAME_TITLE:" /tmp/process_output.txt | cut -d':' -f2- || echo "")
          echo "game_title=$GAME_TITLE" >> $GITHUB_OUTPUT
          
          DEPOT_ID=$(grep "DEPOT_ID:" /tmp/process_output.txt | cut -d':' -f2 || echo "")
          echo "depot_id=$DEPOT_ID" >> $GITHUB_OUTPUT
          
          APP_ID=$(grep "APP_ID:" /tmp/process_output.txt | cut -d':' -f2 || echo "")
          echo "app_id=$APP_ID" >> $GITHUB_OUTPUT

      - name: Force Push to Clean Single-Commit data Branch
        if: |
          (steps.sync_upstream.outputs.modified != '0' && steps.sync_upstream.outputs.modified != '') ||
          steps.process_key.outputs.result == 'MERGED'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Reset data branch to a single root commit (orphan), keeping depotkeys.bin and signatures/ intact
          COMMIT_MSG="chore(data): sync depot keys database [skip ci]"
          if [ "${{ steps.process_key.outputs.result }}" = "MERGED" ]; then
            COMMIT_MSG="chore(data): merge depot ${{ steps.process_key.outputs.depot_id }} for ${{ steps.process_key.outputs.game_title }} [skip ci]"
          fi
          
          git checkout --orphan data-squashed
          git rm -rf --cached . > /dev/null 2>&1 || true
          git add -f depotkeys.bin
          if [ -d signatures ]; then
            git add -f signatures/
          fi
          git commit -m "$COMMIT_MSG"
          git branch -D data 2>/dev/null || true
          git branch -m data
          git push -f origin data
      - name: Comment on Issue (Success)
        if: steps.process_key.outputs.result == 'MERGED'
        uses: actions/github-script@v9
        with:
          script: |
            const depotId = '${{ steps.process_key.outputs.depot_id }}';
            const gameTitle = '${{ steps.process_key.outputs.game_title }}';
            const appId = '${{ steps.process_key.outputs.app_id }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### 🎉 Key Verified & Merged!\n\n- **Game Title**: ${gameTitle} (AppID: \`${appId}\`)\n- **Depot ID**: \`${depotId}\`\n\nThe decryption key has passed Steam metadata verification and entropy checks, and is now merged into \`depotkeys.bin\`!`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });

      - name: Comment on Issue (Duplicate)
        if: steps.process_key.outputs.result == 'DUPLICATE'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### ℹ️ Already Up to Date\n\nThis Depot Key already exists in \`depotkeys.bin\` with the same decryption key. Closing as duplicate.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'not_planned'
            });

      - name: Comment on Issue (Conflict / Invalid)
        if: steps.process_key.outputs.result == 'CONFLICT_REQUIRES_MANUAL_REVIEW' || steps.process_key.outputs.result == 'INVALID_KEY' || steps.process_key.outputs.result == 'INVALID_FORM'
        uses: actions/github-script@v9
        with:
          script: |
            const result = '${{ steps.process_key.outputs.result }}';
            let message = '';
            if (result === 'CONFLICT_REQUIRES_MANUAL_REVIEW') {
              message = `### ⚠️ Key Conflict Warning\n\nThis Depot ID already exists in the database with a **different** decryption key.\n\nTo prevent database pollution and malicious overwrites, an automatic overwrite was blocked. A maintainer will manually verify this key.`;
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['conflict-review']
              });
            } else {
              message = `### ❌ Validation Failed\n\nThe submitted Depot Key format, entropy, or AppID form fields could not be verified. Please ensure you provide a valid 64-character hexadecimal AES-256 key.`;
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['invalid']
              });
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
